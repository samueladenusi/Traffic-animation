<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="traffic.css" />
    <title>Traffic animation</title>
  </head>
  <body>
    <div class="sky-illustration">
      <img class="skye" src="Traffic Images/skye.jpg" alt="" />

      <div>
        <img
          class="aeroplane"
          src="Traffic Images/Aeroplane_2-removebg-preview.png"
          alt="" />
      </div>
      <div>
        <img
          class="buildings"
          src="Traffic Images/ilustrasion-scene.png"
          alt="" />
      </div>
      <div class="green"></div>
      <img class="road" src="Traffic Images/road.png" alt="" />
      <div class="brown"></div>
      <img class="road" src="Traffic Images/road.png" alt="" />

      <div class="road-pole">
        <div class="two-poles">
          <img src="Traffic Images/street_light.png" alt="" />
          <img
            class="one-way"
            src="Traffic Images/one_way-removebg-preview.png"
            alt="" />
        </div>

        <div><img src="Traffic Images/street_light.png" alt="" /></div>
        <div><img src="Traffic Images/street_light.png" alt="" /></div>
        <div>
          <img
            class="one-way"
            src="Traffic Images/one_way-removebg-preview.png"
            alt="" />
        </div>
      </div>
      <img class="sport-car" src="Traffic Images/sport car.png" alt="" />
      <img class="truck" src="Traffic Images/yellow_truck.png" alt="" />
      <img class="yellow-car" src="Traffic Images/yellow_car.png" alt="" />
      <img class="woman" src="Traffic Images/woman.png" alt="" />
      <img class="man" src="Traffic Images/man_walking.png" alt="" />
      <img class="blue-truck" src="Traffic Images/truck.png" alt="" />
      <img class="yellow-taxi" src="Traffic Images/yellow_taxi.png" alt="" />
      <img class="bike" src="Traffic Images/bike.png" alt="" />
      <img
        class="helicopter"
        src="Traffic Images/air-helicopter-removebg-preview.png"
        alt="" />
    </div>
  </body>
</html>
